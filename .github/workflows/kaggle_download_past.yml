name: Download past Kaggle submissions

# One-off diagnostic: fetch our own previously scored submission files so they
# can be ensembled offline. Uses the repository's existing Kaggle credentials.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kaggle_download_past.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: python -m pip install --quiet kaggle six

      - name: Download selected past submissions
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -uo pipefail
          mkdir -p submissions/past
          {
            kaggle --version
            kaggle competitions submission-download --help
          } > reports/past_download.log 2>&1
          for ref in 58415875 58369543 58373393 58346197 58474337 58336311; do
            rm -rf /tmp/kdl && mkdir -p /tmp/kdl
            echo "=== $ref ===" >> reports/past_download.log
            kaggle competitions submission-download "$ref" -p /tmp/kdl --force >> reports/past_download.log 2>&1 || true
            f=$(find /tmp/kdl -type f -name '*.csv' | head -1)
            if [ -n "$f" ]; then
              cp "$f" "submissions/past/ref_${ref}.csv"
              echo "downloaded $ref -> $(wc -c < "submissions/past/ref_${ref}.csv") bytes" >> reports/past_download.log
            else
              echo "no csv downloaded for $ref" >> reports/past_download.log
            fi
          done
          cat reports/past_download.log

      - name: Commit downloaded submissions
        if: always()
        run: |
          git config user.name "past-submission-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p submissions/past reports
          echo "download step reached" > reports/past_download_status.txt
          git add submissions/past reports/past_download.log reports/past_download_status.txt
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Archive past high-scoring Kaggle submissions [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
