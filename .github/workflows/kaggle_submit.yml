name: Submit to Kaggle

# A push to main triggers a Kaggle submission ONLY when the fixed-name file
# submissions/best_submission.csv changes. Other pushes do not submit.
# Kaggle credentials are repository secrets: KAGGLE_USERNAME and KAGGLE_KEY.
on:
  push:
    branches: [main]
    paths:
      - 'submissions/best_submission.csv'
  workflow_dispatch:
    inputs:
      submission:
        description: 'Submission CSV path (relative to repository root)'
        required: false
        default: 'submissions/best_submission.csv'
      message:
        description: 'Kaggle submission message'
        required: false
        default: 'SparseViT v5 weighted ensemble (w_global=0.4, w_patch=0.6), thr=0.59'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate submission CSV
        env:
          SUBMISSION: ${{ github.event.inputs.submission || 'submissions/best_submission.csv' }}
        run: python scripts/submit_kaggle.py --dry-run --submission "$SUBMISSION"

      - name: Check Kaggle credentials
        id: creds
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KAGGLE_USERNAME / KAGGLE_KEY secrets are not set; skipping submission."
          fi

      - name: Install Kaggle CLI
        if: steps.creds.outputs.available == 'true'
        run: python -m pip install --quiet kaggle

      - name: Submit to Kaggle
        if: steps.creds.outputs.available == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          SUBMISSION: ${{ github.event.inputs.submission || 'submissions/best_submission.csv' }}
          MESSAGE: ${{ github.event.inputs.message || 'SparseViT v5 weighted ensemble (w_global=0.4, w_patch=0.6), thr=0.59' }}
        run: python scripts/submit_kaggle.py --submission "$SUBMISSION" --message "$MESSAGE"
